  <path d="M185 292 C205 289 225 292 240 300" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M185 314 C205 311 225 314 240 322" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M327 270 C307 267 287 270 272 278" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M327 292 C307 289 287 292 272 300" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M327 314 C307 311 287 314 272 322" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Pro ASN Ribbon Banner -->
  <rect x="156" y="380" width="200" height="38" rx="8" fill="url(#goldGrad)" />
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#0f172a" text-anchor="middle" letter-spacing="3">PRO ASN</text>
